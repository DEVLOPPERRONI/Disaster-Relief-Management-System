<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Disaster Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="dashboard-body">
    <div class="layout-wrapper">
      <aside class="sidebar shadow-sm" id="sidebar">
        <div class="sidebar-brand">
          <span class="brand-icon"><i class="bi bi-shield-shaded"></i></span>
          <div>
            <h5 class="mb-0">DMS</h5>
            <small>Control Center</small>
          </div>
        </div>
        <nav class="nav flex-column sidebar-nav">
          <a class="nav-link active" href="dashboard.html"><i class="bi bi-house-door"></i> Dashboard</a>
          <a class="nav-link" href="disasters.html"><i class="bi bi-tornado"></i> Disasters</a>
          <button class="nav-link btn text-start" id="logoutBtn" type="button">
            <i class="bi bi-box-arrow-right"></i> Logout
          </button>
        </nav>
      </aside>
      <main class="main-content">
        <header class="top-header shadow-sm">
          <button class="btn btn-outline-primary d-lg-none" id="sidebarToggle" type="button">
            <i class="bi bi-list"></i>
          </button>
          <div>
            <h4 class="mb-0">Dashboard</h4>
            <small class="text-muted">Monitor disasters and emergency response status</small>
          </div>
          <div class="ms-auto fw-semibold" id="welcomeUser"></div>
        </header>
        <section class="content p-3 p-lg-4">
          <div class="row g-3 mb-4" id="statsCards">
            <div class="col-md-4">
              <div class="stat-card p-4">
                <div class="stat-icon bg-primary-subtle text-primary"><i class="bi bi-collection"></i></div>
                <p class="stat-label">Total Disasters</p>
                <h3 id="totalDisasters">--</h3>
              </div>
            </div>
            <div class="col-md-4">
              <div class="stat-card p-4">
                <div class="stat-icon bg-warning-subtle text-warning"><i class="bi bi-broadcast-pin"></i></div>
                <p class="stat-label">Active Disasters</p>
                <h3 id="activeDisasters">--</h3>
              </div>
            </div>
            <div class="col-md-4">
              <div class="stat-card p-4">
                <div class="stat-icon bg-danger-subtle text-danger"><i class="bi bi-exclamation-triangle"></i></div>
                <p class="stat-label">High/Critical Severity</p>
                <h3 id="highSeverityDisasters">--</h3>
              </div>
            </div>
          </div>
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
              <h5 class="fw-bold">Emergency Readiness Snapshot</h5>
              <p class="text-muted mb-0">
                Use the disasters section to create incidents, track severity, and update statuses in real time.
              </p>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="js/dashboard.js"></script>
  </body>
</html>
