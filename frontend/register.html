<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Disaster Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-bg">
    <div class="container py-5">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-6 col-md-9">
          <div class="auth-card card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <span class="brand-pill"><i class="bi bi-life-preserver"></i> DMS</span>
                <h2 class="fw-bold mt-3 mb-1">Create Account</h2>
                <p class="text-muted mb-0">Register to manage disaster records securely</p>
              </div>

              <div id="authAlert" class="alert d-none" role="alert"></div>

              <form id="registerForm" novalidate>
                <div class="row g-3">
                  <div class="col-12">
                    <label class="form-label">Full Name</label>
                    <input
                      type="text"
                      id="registerName"
                      class="form-control form-control-lg"
                      placeholder="Enter full name"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input
                      type="email"
                      id="registerEmail"
                      class="form-control form-control-lg"
                      placeholder="Enter email address"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Phone Number</label>
                    <input
                      type="text"
                      id="registerPhone"
                      class="form-control form-control-lg"
                      placeholder="Enter phone number"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input
                      type="password"
                      id="registerPassword"
                      class="form-control form-control-lg"
                      placeholder="Enter password"
                      required
                    />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Confirm Password</label>
                    <input
                      type="password"
                      id="registerConfirmPassword"
                      class="form-control form-control-lg"
                      placeholder="Confirm password"
                      required
                    />
                  </div>
                </div>
                <button id="registerBtn" class="btn btn-primary w-100 btn-lg dms-btn mt-4" type="submit">
                  <span class="btn-label">Register</span>
                </button>
              </form>

              <p class="text-center mt-4 mb-0">
                Already have an account? <a href="login.html" class="fw-semibold">Login</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
