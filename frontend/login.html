<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Disaster Management System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-bg">
    <div class="container py-5">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-lg-5 col-md-8">
          <div class="auth-card card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <span class="brand-pill"><i class="bi bi-shield-fill-check"></i> DMS</span>
                <h2 class="fw-bold mt-3 mb-1">Welcome Back</h2>
                <p class="text-muted mb-0">Sign in with your email or phone number</p>
              </div>

              <div id="authAlert" class="alert d-none" role="alert"></div>

              <form id="loginForm" novalidate>
                <div class="mb-3">
                  <label class="form-label">Email or Phone Number</label>
                  <input
                    type="text"
                    id="loginIdentity"
                    class="form-control form-control-lg"
                    placeholder="Enter email or phone"
                    required
                  />
                </div>
                <div class="mb-4">
                  <label class="form-label">Password</label>
                  <input
                    type="password"
                    id="loginPassword"
                    class="form-control form-control-lg"
                    placeholder="Enter password"
                    required
                  />
                </div>
                <button id="loginBtn" class="btn btn-primary w-100 btn-lg dms-btn" type="submit">
                  <span class="btn-label">Login</span>
                </button>
              </form>

              <p class="text-center mt-4 mb-0">
                New here? <a href="register.html" class="fw-semibold">Create an account</a>
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="js/auth.js"></script>
  </body>
</html>
